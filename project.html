<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Architecture and urban design projects by Niki Jaško."><title>Niki Jaško — Projects</title><link rel="stylesheet" href="style.css"></head><body><header><a class="name" href="index.html">Niki Jaško<span>Architecture & urban design</span></a><nav aria-label="Main navigation"><a href="index.html">Projects</a><a href="index.html#about">About / Contact</a></nav></header><main id="detail"></main><footer><span>Niki Jaško</span><a href="mailto:njasko26@gmail.com">njasko26@gmail.com</a></footer><script src="projects.js"></script><script>const p=projects.find(p=>p.id===new URLSearchParams(location.search).get('id'));if(p){document.title=p.title+' — Niki Jaško';document.querySelector('#detail').innerHTML=`<a class="back" href="index.html">← Projects</a><div class="project-heading"><h1>${p.title}</h1><span>${p.type} · ${p.year}</span></div><div class="intro"><p>${p.text}</p><p class="credits">${p.credit}</p></div><div class="gallery">${p.media.map((a,i)=>`<figure class="figure-${i}"><a href="${a.src}" target="_blank" rel="noopener"><img src="${a.src}" alt="${p.title} — ${a.caption}" loading="${i===0?'eager':'lazy'}"></a><figcaption>${a.caption}</figcaption></figure>`).join('')}</div><div class="next"><a href="index.html">← Projects</a><a href="project.html?id=${projects[(projects.indexOf(p)+1)%projects.length].id}">Next project →</a></div>`}else{document.querySelector('#detail').innerHTML='<h1>Project not found</h1><a href="index.html">Projects</a>'}</script></body></html>
