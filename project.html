<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Architecture and urban design projects by Niki Jaško."><title>Niki Jaško — Projects</title><link rel="stylesheet" href="style-v5.css"><link rel="stylesheet" href="school-v35.css"><link rel="stylesheet" href="thesis-theory-v29.css"><link rel="stylesheet" href="case-analyses-v29.css"><link rel="stylesheet" href="masterplan-v34.css"><link rel="stylesheet" href="thesis-media-v34.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header><a class="name" href="index.html?v=35">Niki Jaško<span>Architecture & urban design</span></a><nav aria-label="Main navigation"><a href="index.html?v=35">Projects</a><a href="index.html?v=35#about">About / Contact</a></nav></header><main id="detail"></main><footer><span>Niki Jaško</span><a href="mailto:njasko26@gmail.com">njasko26@gmail.com</a></footer><script src="projects-v7.js"></script><script src="school-v35.js"></script><script src="case-analyses-v29-data.js"></script><script src="case-analyses-v29.js"></script><script src="masterplan-v34-data.js"></script><script src="masterplan-v34.js"></script><script src="thesis-media-v33.js"></script><script src="thesis-theory-v34.js"></script><script>
const requestedId=new URLSearchParams(location.search).get('id');
const p=projects.find(p=>p.id===requestedId||p.aliases?.includes(requestedId));
function gallery(media,eager=false){return `<div class="gallery">${media.map((a,i)=>`<figure class="figure-${i}"><a href="${a.src}" target="_blank" rel="noopener"><img src="${a.src}" alt="${p.title} — ${a.caption}" width="${a.width}" height="${a.height}" loading="${eager&&i===0?'eager':'lazy'}"></a><figcaption>${a.caption}</figcaption></figure>`).join('')}</div>`}
if(p){
 document.title=p.title+' — Niki Jaško';
 const contents=p.sections?p.sections.map((s,i)=>`<section class="project-section" id="${s.id}" aria-labelledby="heading-${s.id}"><h2 id="heading-${s.id}">${s.title}</h2><div class="intro"><p>${s.text}</p><p class="credits">${s.credit}</p></div>${gallery(s.media,i===0)}</section>`).join(''):gallery(p.media,true);
 const detail=document.querySelector('#detail');if(p.id==='emergence')detail.classList.add('thesis-page');if(p.id==='school')detail.classList.add('school-page');
 detail.innerHTML=p.id==='emergence'?renderThesisPage(p,gallery,projects[(projects.indexOf(p)+1)%projects.length]):p.id==='school'?renderSchoolPage(p,projects[(projects.indexOf(p)+1)%projects.length]):`<a class="back" href="index.html?v=35">← Projects</a><div class="project-heading"><h1>${p.title}</h1><span>${p.type} · ${p.year}</span></div><div class="intro"><p>${p.text}</p><p class="credits">${p.credit}</p></div>${p.id==='school'?'<section style="margin:0 0 60px"><iframe title="Interactive school structural model" src="construction-viewer-v18.html" loading="eager" style="width:100%;height:760px;border:1px solid #ddd;display:block"></iframe></section>':''}${contents}<div class="next"><a href="index.html?v=35">← Projects</a><a href="project.html?v=35&id=${projects[(projects.indexOf(p)+1)%projects.length].id}">Next project →</a></div>`;
 if(p.id==='school')initSchoolPage(detail);
 if(p.id==='emergence'){initCaseComparison(detail,caseAnalyses);initInteractiveMasterplan(detail,masterplanData);initThesisAnimations(detail)}
 if(requestedId!==p.id){
  const canonical=new URL(location.href);canonical.searchParams.set('v','35');canonical.searchParams.set('id',p.id);
  if(requestedId==='street')canonical.hash='street-design';
  history.replaceState(null,'',canonical);
  if(canonical.hash)document.getElementById(canonical.hash.slice(1))?.scrollIntoView();
 }
}else document.querySelector('#detail').innerHTML='<h1>Project not found</h1><a href="index.html?v=35">Projects</a>';
</script></body></html>
