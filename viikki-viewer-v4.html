rap:wrap}#category-controls{min-width:65%}.category{display:flex;gap:7px;align-items:center;cursor:pointer}.category input{accent-color:#5d6855;margin:0}.swatch{width:11px;height:11px;border:1px solid #0002;display:inline-block;border-radius:1px}@media(max-width:700px){#members{padding:10px 12px;align-items:flex-start;gap:10px}#category-controls{display:grid;grid-template-columns:1fr 1fr;font-size:10px;gap:7px}#members legend{display:none}#show-all{padding:4px 6px;white-space:nowrap}}</style><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><section id="viewer" aria-label="Interactive Viikki Building B construction model"><div class="bar"><h2>Building B / Structure</h2><div class="tools" role="group" aria-label="Model views"><button data-view="iso" class="active" aria-pressed="true">Axonometric</button><button data-view="top" aria-pressed="false">Plan</button><button data-view="front" aria-pressed="false">Elevation</button><button id="xray" aria-pressed="false">X-ray</button><button id="reset">Reset</button></div></div><fieldset id="members"><legend>Elements</legend><div id="category-controls" role="group" aria-label="Visible member categories"></div><button id="show-all">Show all</button></fieldset><div id="stage"><span id="status" role="status">Loading model…</span><div id="error">The model could not load. <button id="retry" type="button">Try again</button> <a href="viikki-b-section-a-v49.webp" target="_blank" rel="noopener">View the sections</a>.</div></div><div class="bottom"><label class="slice" for="slice">Cutaway <input id="slice" type="range" min="0" max="100" value="100" aria-label="Visible structure height"><output id="level" for="slice">Full model</output></label><span class="hint">Drag to orbit · Scroll / pinch to zoom · Right-drag to pan</span></div></section><script type="module" src="viikki-viewer-v4.js" onerror="document.querySelector('#status').textContent='';document.querySelector('#error').style.display='block
